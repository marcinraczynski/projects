<style>
/* VOICE: doradztwo strategiczne z kreatywnym DNA, lekko i nowocześnie
   IDEA: znak „+” jako cegiełka – z plusów składają się bryły czterech obszarów oferty
   PICTURE: żywa bryła z plusów w świetlistej przestrzeni (tarcza, spirala, znak K+, słupki danych)
   COLOUR and TYPE: jasna szarość, grafit złagodzony do #2B2B2B, żółty #F7E14C jako akcent w bryłach i na paskach; Inter
   LAYOUT: węższy tekst po lewej, bryła po prawej, cztery białe karty oferty w jednej linii na dole */
:root{--ink:#111111;--sub:#4E4E4E;--mute:#767676;--line:#D9D9D9;--soft:#F3F3EF;--yel:#F7E14C}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
nav{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
nav .links{display:flex;gap:32px;font-size:15px;font-weight:500;align-items:center}
nav .links a{color:var(--ink);text-decoration:none}
nav .lang{color:var(--mute);font-size:14px;margin-left:12px}nav .lang b{color:var(--ink);font-weight:500}
.hero{position:relative;margin:0 24px;border-radius:16px;background:var(--soft);overflow:hidden;height:calc(100vh - 112px);height:calc(100svh - 112px);min-height:540px;isolation:isolate}
.atmo{position:absolute;inset:-10%;z-index:0;filter:blur(70px);pointer-events:none}
.atmo i{position:absolute;border-radius:50%}
.atmo .a1{width:46%;height:60%;left:50%;top:6%;background:radial-gradient(circle,rgba(247,225,76,.6),rgba(247,225,76,0) 70%);animation:f1 18s ease-in-out infinite alternate}
.atmo .a2{width:55%;height:70%;left:62%;top:30%;background:radial-gradient(circle,rgba(206,218,233,1),rgba(206,218,233,0) 70%);animation:f2 22s ease-in-out infinite alternate}
.atmo .a3{width:44%;height:55%;left:26%;top:-12%;background:radial-gradient(circle,rgba(255,255,255,1),rgba(255,255,255,0) 70%);animation:f3 16s ease-in-out infinite alternate}
.atmo .a4{width:30%;height:40%;left:80%;top:-6%;background:radial-gradient(circle,rgba(247,225,76,.4),rgba(247,225,76,0) 70%);animation:f2 26s ease-in-out infinite alternate-reverse}
.atmo .a5{width:34%;height:44%;left:44%;top:62%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);animation:f1 20s ease-in-out infinite alternate-reverse}
@keyframes f1{to{transform:translate(-8%,10%) scale(1.15)}}
@keyframes f2{to{transform:translate(-10%,-8%) scale(.9)}}
@keyframes f3{to{transform:translate(12%,8%) scale(1.2)}}
.floor{position:absolute;z-index:1;left:54%;right:8%;bottom:25%;height:14%;background:radial-gradient(50% 40% at 50% 50%,rgba(17,17,17,.09),rgba(17,17,17,0) 70%);filter:blur(8px);pointer-events:none}
.grain{position:absolute;inset:0;z-index:2;opacity:.05;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.fade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--soft) 0%,rgba(243,243,239,.8) 26%,rgba(243,243,239,0) 44%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.copy{position:absolute;left:96px;top:39%;transform:translateY(-50%);z-index:3;max-width:600px}
.copy h1{white-space:nowrap;font-size:clamp(36px,3.6vw,54px);line-height:1.05;font-weight:600;letter-spacing:-.025em}
.copy p{margin-top:22px;font-size:17px;line-height:1.55;color:var(--sub);max-width:420px}
.copy .more{margin-top:30px;display:inline-flex;gap:10px;align-items:center;font-size:15px;font-weight:500;color:var(--ink);text-decoration:none}
.offer{position:absolute;left:24px;right:24px;bottom:24px;z-index:3}
.offer h2{font-size:14px;font-weight:500;color:var(--sub);margin:0 0 14px 72px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.step{display:flex;flex-direction:column;cursor:pointer;border:0;text-align:left;font:inherit;color:var(--ink);padding:18px 22px 20px;border-radius:12px;background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .4s,box-shadow .4s}
.step .bar{height:3px;border-radius:2px;background:rgba(17,17,17,.08);position:relative;overflow:hidden;margin-bottom:14px}
.step .bar i{position:absolute;inset:0;background:var(--yel);transform:scaleX(0);transform-origin:left}
.step .t{display:flex;gap:10px;align-items:baseline;font-size:15px;font-weight:500;white-space:nowrap}
.step .n{font-size:13px;color:var(--mute);font-weight:500}
.step .d{margin-top:6px;font-size:13px;line-height:1.5;text-wrap:pretty;color:var(--mute);transition:color .4s}
.step.on{background:#fff;box-shadow:0 10px 30px rgba(17,17,17,.06)}
.step.on .d{color:var(--sub)}
.step:not(.on) .t span:last-child{color:var(--sub)}
.step:hover{background:rgba(255,255,255,.85)}
.step:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.note{max-width:1240px;margin:28px auto 80px;padding:0 96px;color:var(--sub);font-size:15px;line-height:1.6}
@media (max-width:1100px){.copy{left:28px;right:28px;top:24%}.copy h1{font-size:38px}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.offer h2{margin-left:4px}nav .links{display:none}.fade{background:linear-gradient(180deg,var(--soft) 0%,rgba(243,243,239,0) 45%)}}
@media (prefers-reduced-motion:reduce){.atmo i{animation:none}}
@media (max-width:700px){.copy{top:28px;transform:none;left:24px;right:24px}.copy h1{white-space:normal;font-size:32px}.copy p{font-size:15px;margin-top:14px}.copy .more{margin-top:18px}.offer{left:12px;right:12px;bottom:12px}.steps{grid-template-columns:1fr!important}.step:not(.on){display:none}nav{padding:0 20px}.hero{margin:0 12px}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const STEPS=[
 ['01','Reputacja i ryzyko','Doradzamy zarządom w ważnych decyzjach i przygotowujemy firmy na kryzys.'],
 ['02','Zmiana i transformacja','Prowadzimy komunikację restrukturyzacji, fuzji i nowych modeli pracy.'],
 ['03','Marka i kampanie','Budujemy rozpoznawalność: premiery, kampanie, twórcy i social media.'],
 ['04','Dane, ESG i AI','Mierzymy efekty, mówimy o ESG na faktach i dbamy o wizerunek w AI.']
];
const stepsEl=document.getElementById('steps');
const nb=s=>s.replace(/(^|\s)([A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]{1,2})\s/g,'$1$2\u00A0').replace(/(^|\s)([A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]{1,2})\s/g,'$1$2\u00A0');
stepsEl.innerHTML=STEPS.map((s,i)=>`<button class="step" data-i="${i}"><div class="bar"><i></i></div><div class="t"><span class="n">${s[0]}</span><span>${s[1]}</span></div><div class="d">${nb(s[2])}</div></button>`).join('');
document.querySelectorAll('.copy p').forEach(p=>p.textContent=nb(p.textContent));
const hero=document.getElementById('hero'),cv=document.getElementById('gl');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=Math.random;
const ga=Math.PI*(3-Math.sqrt(5));
function fib(n,r,c=[0,0,0]){const o=[];for(let i=0;i<n;i++){const y=1-i/(n-1)*2,rr=Math.sqrt(1-y*y),a=ga*i;o.push([c[0]+Math.cos(a)*rr*r,c[1]+y*r,c[2]+Math.sin(a)*rr*r]);}return o;}
// ---------- shapes: {p:[[x,y,z]], y:[0/1], th: edge distance, k: max edges per point} ----------
function plusShape(){const p=[],y=[];const L=.9,T=.3,D=.3,st=.15;
  for(let x=-L;x<=L+1e-6;x+=st)for(let yy=-L;yy<=L+1e-6;yy+=st)for(let z=-D;z<=D+1e-6;z+=st){const v=Math.abs(x)<=T+1e-6,h=Math.abs(yy)<=T+1e-6;if(!(v||h))continue;
    const e=1e-6,surf=Math.abs(z)>D-e||Math.abs(x)>L-e||Math.abs(yy)>L-e||(v&&!h&&Math.abs(x)>T-e)||(h&&!v&&Math.abs(yy)>T-e);if(!surf)continue;p.push([x,yy,z]);y.push(0);}
  return {p,y,th:.16,k:4};}
function sphereShell(){const p=fib(520,1.02),y=p.map(()=>0);return {p,y,th:.2,k:3};}
function morphCube(){const p=[],y=[];const n=9,s=1.3/(n-1);
  for(let a=0;a<n;a++)for(let b=0;b<n;b++)for(let c=0;c<n;c++){if(!(a==0||b==0||c==0||a==n-1||b==n-1||c==n-1))continue;p.push([(a-(n-1)/2)*s,(b-(n-1)/2)*s,(c-(n-1)/2)*s]);
    const e=[a==0||a==n-1,b==0||b==n-1,c==0||c==n-1].filter(Boolean).length>=2;y.push(0);}
  return {p,y,th:s*1.05,k:4};}
function ripple(){const p=[],y=[];for(let r=.12;r<=1.45;r+=.11){const n=Math.max(8,Math.round(r*42));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([Math.cos(a)*r,0,Math.sin(a)*r]);y.push(r<.2?1:0);}}return {p,y,th:.17,k:3};}
function network(){const p=[],y=[];const layers=[3,5,5,3],X=[-1.2,-.4,.4,1.2];const nodes=[];
  layers.forEach((n,li)=>{for(let i=0;i<n;i++){const a=i/n*Math.PI*2+li*.55,r=n>3?.82:.5;nodes.push({l:li,p:[X[li],Math.sin(a)*r,Math.cos(a)*r*.8]});}});
  nodes.forEach(nd=>fib(16,.08,nd.p).forEach(q=>{p.push(q);y.push(nd.l==3?1:0)}));
  const d2=(a,b)=>(a.p[1]-b.p[1])**2+(a.p[2]-b.p[2])**2;
  for(const a of nodes){const nx=nodes.filter(b=>b.l===a.l+1).sort((q,r)=>d2(a,q)-d2(a,r)).slice(0,a.l===2?2:3);
    for(const b of nx){const len=Math.hypot(...a.p.map((v,i)=>b.p[i]-v)),m=Math.round(len/.11);for(let k=1;k<m;k++){const u=k/m;p.push(a.p.map((v,i)=>v+(b.p[i]-v)*u));y.push(0);}}}
  return {p,y,th:.13,k:3};}
const RAW=[plusShape(),sphereShell(),morphCube(),ripple(),network()];   // 0 = plus, 1..4 = obszary
const N=Math.max(...RAW.map(s=>s.p.length));
// edges by k-nearest neighbours
function edges(s){const P=s.p,E=[],seen=new Set();for(let i=0;i<P.length;i++){const d=[];for(let j=0;j<P.length;j++){if(j===i)continue;const q=(P[i][0]-P[j][0])**2+(P[i][1]-P[j][1])**2+(P[i][2]-P[j][2])**2;if(q<s.th*s.th)d.push([q,j]);}
  d.sort((a,b)=>a[0]-b[0]);for(const [,j] of d.slice(0,s.k)){const key=i<j?i+'_'+j:j+'_'+i;if(!seen.has(key)){seen.add(key);E.push(i,j);}}}return E;}
// resample to N, ordered left→right so morphs sweep
const SH=RAW.map(s=>{const L=s.p.length,ord=[...Array(L).keys()].sort((a,b)=>(s.p[a][0]+s.p[a][1]*.25)-(s.p[b][0]+s.p[b][1]*.25));const inv=new Array(L);ord.forEach((k,r)=>inv[k]=r);
  const p=new Float32Array(N*3),y=new Float32Array(N),rep=new Array(L);
  for(let i=0;i<N;i++){const r=Math.min(L-1,Math.floor(i*L/N)),k=ord[r];p[i*3]=s.p[k][0];p[i*3+1]=s.p[k][1];p[i*3+2]=s.p[k][2];y[i]=s.y[k];if(rep[r]===undefined)rep[r]=i;}
  const E=edges(s).map(k=>rep[inv[k]]);return {p,y,E:new Uint32Array(E)};});
// ---------- three ----------
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(30,1,.1,100);cam.position.set(0,.2,6.6);
const pos=new Float32Array(N*3),yel=new Float32Array(N);
const geo=new THREE.BufferGeometry();const aPos=new THREE.BufferAttribute(pos,3),aY=new THREE.BufferAttribute(yel,1);
aPos.setUsage(THREE.DynamicDrawUsage);aY.setUsage(THREE.DynamicDrawUsage);geo.setAttribute('position',aPos);geo.setAttribute('aY',aY);
const depth=`float c=-(modelViewMatrix*vec4(0.,0.,0.,1.)).z;vD=clamp((-mv.z-(c-.95))/1.8,0.,1.);`;
const pMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uPx:{value:1}},
 vertexShader:`attribute float aY;uniform float uPx;varying float vY;varying float vD;
  void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;${depth}vY=aY;gl_PointSize=19.*uPx*(1.+vY*.25)*mix(1.35,.8,vD)/(-mv.z);}`,
 fragmentShader:`varying float vY;varying float vD;
  void main(){float r=length(gl_PointCoord-.5);float m=1.-smoothstep(.34,.46,r);if(m<.02)discard;
   vec3 bg=vec3(.90,.905,.89);vec3 ink=mix(vec3(.1),bg,vD*.55);vec3 y=mix(vec3(.95,.74,0.),vec3(.98,.86,.3),vD*.4);
   gl_FragColor=vec4(mix(ink,y,smoothstep(.2,.8,vY)),mix(1.,.45,vD)*m);}`});
function lineMat(){return new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uOp:{value:1}},
 vertexShader:`attribute float aY;varying float vY;varying float vD;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;${depth}vY=aY;}`,
 fragmentShader:`uniform float uOp;varying float vY;varying float vD;void main(){vec3 col=mix(vec3(.12),vec3(.93,.72,0.),smoothstep(.3,.9,vY));
   gl_FragColor=vec4(col,uOp*mix(mix(.34,.07,vD),mix(.75,.35,vD),smoothstep(.3,.9,vY)));}`});}
function lineGeo(){const g=new THREE.BufferGeometry();g.setAttribute('position',aPos);g.setAttribute('aY',aY);return g;}
const gA=lineGeo(),gB=lineGeo(),mA=lineMat(),mB=lineMat();
const lA=new THREE.LineSegments(gA,mA),lB=new THREE.LineSegments(gB,mB),pts=new THREE.Points(geo,pMat);
lA.frustumCulled=lB.frustumCulled=pts.frustumCulled=false;
const grp=new THREE.Group();grp.add(lA,lB,pts);scene.add(grp);
function size(){const W=hero.clientWidth,H=hero.clientHeight;const dpr=Math.min(2,devicePixelRatio||1);renderer.setPixelRatio(dpr);renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();pMat.uniforms.uPx.value=dpr*(H/820);
  const narrow=W<1100;const mob=W<700;grp.position.set(narrow?0:1.9*(W/H)/1.8*0.66,mob?-.05:(narrow?-.2:.55),0);grp.scale.setScalar(mob?.5:(narrow?.62:.9));}
addEventListener('resize',size);size();
// ---------- motion per shape ----------
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fx(x,y,z,k,t,o){let c,s,X=x,Y=y,Z=z;
  if(k===0){const a=Math.sin(t*.5)*.4;c=Math.cos(a);s=Math.sin(a);X=c*x-s*z;Z=s*x+c*z;}
  else if(k===1){const a=t*.2;c=Math.cos(a);s=Math.sin(a);X=c*x-s*z;Z=s*x+c*z;}
  else if(k===2){const m=.5+.5*Math.sin(t*.9),l=Math.hypot(x,y,z)||1,f=1+m*(.82/l-1);x*=f;y*=f;z*=f;const a=t*.2;c=Math.cos(a);s=Math.sin(a);X=c*x-s*z;Y=y;Z=s*x+c*z;}
  else if(k===3){const r=Math.hypot(x,z);y=.3*Math.sin(r*6-t*2.6)*Math.exp(-r*.6);c=Math.cos(.32);s=Math.sin(.32);X=x;Y=c*y-s*z;Z=s*y+c*z;}
  else {const a=Math.sin(t*.4+x)*.06;c=Math.cos(a);s=Math.sin(a);X=x;Y=c*y-s*z;Z=s*y+c*z;}
  o[0]=X;o[1]=Y;o[2]=Z;}
// ---------- sequence: plus → obszar → plus → obszar ... ----------
const SEQ=[0,1,0,2,0,3,0,4],HOLD=[2800,5400],TR=2300;
let si=0,kA=0,kB=0,T=1,tStart=0,cur=0;const els=[...stepsEl.children];
const ord=new Float32Array(N),jit=new Float32Array(N);for(let i=0;i<N;i++){ord[i]=i/N;jit[i]=R();}
function setIdx(g,E){g.setIndex(new THREE.BufferAttribute(E,1));}
function paint(){els.forEach((e,i)=>{e.classList.toggle('on',i===cur);e.querySelector('i').style.transform='scaleX(0)';});}
function go(s){si=(s+SEQ.length)%SEQ.length;kA=kB;kB=SEQ[si];setIdx(gA,SH[kA].E);setIdx(gB,SH[kB].E);T=0;
  const c=Math.floor(si/2);if(c!==cur||si%2===0){cur=c;tStart=performance.now();paint();}stateStart=performance.now();}
let stateStart=0;
els.forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(SEQ[si]!==i+1)go(i*2+1);});
setIdx(gA,SH[0].E);setIdx(gB,SH[0].E);paint();
let mx=0,my=0,tx=0,ty=0;hero.addEventListener('mousemove',e=>{const r=hero.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5;});
let last=performance.now(),ph=0;const a=[0,0,0],b=[0,0,0];
// yellow light passing through every shape
const band=(s,c,w)=>Math.exp(-Math.pow((s-c)*w,2));
function sweep(k,x,y,z,t){
  if(k===0)return band((x+y)*.72,((t/2.8)%1)*3.4-1.7,4.5);            // plus: po skosie
  if(k===1)return band(-y,((t/3.2)%1)*2.8-1.4,5);                      // kula: z góry na dół
  if(k===2)return band(x+z*.3,((t/3.2)%1)*3-1.5,5);                    // sześcian: od lewej
  if(k===3)return band(Math.hypot(x,z),((t/2.6)%1)*1.9,6);             // fala: puls od środka
  return band(x,((t/3.2)%1)*2.8-1.4,7);}                               // sieć: od wejścia do wyjścia
function update(now){const t=now/1000;const PA=SH[kA].p,PB=SH[kB].p,YA=SH[kA].y,YB=SH[kB].y;
    for(let i=0;i<N;i++){const d=ord[i]*.42+jit[i]*.1,u=ease(Math.min(1,Math.max(0,(T-d)/.48))),i3=i*3;
    fx(PA[i3],PA[i3+1],PA[i3+2],kA,t,a);fx(PB[i3],PB[i3+1],PB[i3+2],kB,t,b);
    const mxx=(a[0]+b[0])/2,myy=(a[1]+b[1])/2,mzz=(a[2]+b[2])/2,l=Math.hypot(mxx,myy,mzz)||1,sn=Math.sin(Math.PI*u);
    pos[i3]=a[0]+(b[0]-a[0])*u+mxx/l*.24*sn;pos[i3+1]=a[1]+(b[1]-a[1])*u+(myy/l*.24+.16)*sn;pos[i3+2]=a[2]+(b[2]-a[2])*u+mzz/l*.24*sn;
    let yv=YA[i]+(YB[i]-YA[i])*u;const sw=sweep(kA,pos[i3],pos[i3+1],pos[i3+2],t)*(1-u)+sweep(kB,pos[i3],pos[i3+1],pos[i3+2],t)*u;yel[i]=Math.max(yv,sw);}
  aPos.needsUpdate=true;aY.needsUpdate=true;
  mA.uniforms.uOp.value=kA===kB?1:1-Math.min(1,T/.45);mB.uniforms.uOp.value=kA===kB?0:Math.max(0,(T-.55)/.45);}
function frame(now){const dt=Math.min(50,now-last);last=now;
  if(T<1)T=Math.min(1,T+dt/(reduce?1:TR));
  const hold=HOLD[si%2];if(!reduce&&now-stateStart>hold)go(si+1);
  const total=HOLD[0]+HOLD[1];els[cur].querySelector('i').style.transform=`scaleX(${Math.min(1,(now-tStart)/total)})`;
  update(now);mx+=(tx-mx)*.04;my+=(ty-my)*.04;ph+=dt*.00022;
  grp.rotation.y=-.45+Math.sin(ph)*.4+mx*.4;grp.rotation.x=.18+Math.sin(ph*.6)*.05+my*.2;
  renderer.render(scene,cam);requestAnimationFrame(frame);}
stateStart=tStart=performance.now();requestAnimationFrame(frame);


}
